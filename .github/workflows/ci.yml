name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install
        run: pip install -r backend/requirements-dev.txt

      - name: Lint
        run: ruff check backend scripts

      # The suite runs entirely on the deterministic synthetic generator, so CI
      # never needs the NASA download and cannot be broken by that host going down.
      - name: Test
        run: pytest -q

      - name: Check the committed evidence bundle is consistent
        run: python scripts/export_bundle.py --check-only

      - name: Check the generated types are up to date
        run: |
          python scripts/generate_types.py
          git diff --exit-code -- frontend/src/api/types.ts \
            || (echo "::error::frontend/src/api/types.ts is stale. Run 'make types' and commit." && exit 1)

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund
        working-directory: frontend

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  image:
    name: Deployed image
    runs-on: ubuntu-latest
    # The hosted demo is the submission's demo link, so a broken image is a broken
    # submission. Building it on every push catches that here rather than on Render.
    steps:
      - uses: actions/checkout@v4
      - name: Build the replay image
        run: docker build -t sidekick:ci .
      - name: Confirm it serves the bundle
        run: |
          docker run -d --name sidekick -p 8000:8000 -e PORT=8000 sidekick:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health > /tmp/health.json; then break; fi
            sleep 2
          done
          cat /tmp/health.json
          python -c "import json,sys; h=json.load(open('/tmp/health.json')); sys.exit(0 if h['bundle']['available'] else 1)"
          docker rm -f sidekick
