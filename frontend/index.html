<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sidekick | Test failure warnings</title>
    <meta
      name="description"
      content="Selects failure-prediction models by how their alerts survive sensor faults."
    />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          const saved = localStorage.getItem("sidekick-theme");
          const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          const theme = saved || (prefersDark ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme = theme;
        } catch (error) {
          console.warn("Could not restore the theme preference.", error);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
