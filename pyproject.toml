[project]
name = "sidekick"
version = "2.0.0"
description = "Sensor-fault-aware model selection for predictive maintenance"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
markers = ["integration: exercises real local worker processes"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
