[project]
name = "sidekick"
version = "0.1.0"
description = "Sensor-fault-aware model selection for predictive maintenance"
requires-python = ">=3.11"

[tool.pytest.ini_options]
# The backend package is imported as `app`, so tests resolve it from here
# without needing an editable install.
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: exercises the full fault matrix; excluded from the default run",
]
filterwarnings = [
    "error::DeprecationWarning:app.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend"]
exclude = [".venv", "frontend", "Idea Phase", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]
ignore = [
    "E501",   # line length is enforced by the formatter, not the linter
    "B008",   # FastAPI dependency injection relies on calls in defaults
    "N803",   # X, y are the conventional names for design matrices
    "N806",
    # str + Enum is the Pydantic-compatible spelling: it keeps `.value` explicit at
    # every call site, which StrEnum makes invisible by making the member itself a
    # string. The generated TypeScript unions depend on that being deliberate.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["N802"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
