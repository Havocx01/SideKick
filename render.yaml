# Hosted synthetic experiments are temporary; uploaded data stays local.

services:
  - type: web
    name: sidekick
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SIDEKICK_MODE
        value: demo
      - key: SIDEKICK_LOG_LEVEL
        value: INFO
      - key: SIDEKICK_CORS_ORIGINS
        value: ""
