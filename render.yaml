# Serve committed evidence; local uploads cannot persist on this service.

services:
  - type: web
    name: sidekick
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SIDEKICK_MODE
        value: replay
      - key: SIDEKICK_LOG_LEVEL
        value: INFO
      - key: SIDEKICK_CORS_ORIGINS
        value: ""
